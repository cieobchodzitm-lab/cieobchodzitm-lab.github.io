# Deploy na Vercel z GitHub Actions — plan B, uruchamiany RĘCZNIE.
#
# Ważne: uruchamia się wyłącznie z `workflow_dispatch`, bo integracja Git
# Vercela działa (sprawdzone 2026-11-03: każdy push do `main` kończy się
# deploymentem „Production – cieobchodzitm-lab.github.io"). Włączanie tego na
# push skutkowałoby podwójnym deployem — a bez secretów każdy push byłby
# czerwony, więc domyślnie jest wyłączony.
#
# Jak użyć: Actions → Deploy to Vercel → Run workflow.
#
# Wymagane secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN      — vercel.com/account/tokens → Create
#   VERCEL_ORG_ID     — z .vercel/project.json po `npx vercel link`
#   VERCEL_PROJECT_ID — jw.
name: Deploy to Vercel

on:
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # Najpierw build lokalnie: jak się sypie, nie deployujemy w ogóle.
      - name: Build (weryfikacja)
        run: |
          npm ci --include=dev
          npm run build

      - name: Sprawdź secrety
        run: |
          missing=""
          for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!var}" ]; then missing="$missing $var"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Brakuje secretów:$missing — dodaj je w Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Build po stronie Vercela. Gdyby sypał się tamtejszy builder, zamień na
      # wariant z `--prebuilt`: `npx vercel build --prod` + `npx vercel deploy
      # --prebuilt --prod` — wtedy na Vercel wędrują gotowe artefakty.
      - name: Deploy (produkcja)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
