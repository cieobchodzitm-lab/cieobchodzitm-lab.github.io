<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Virtus I–IV — cztery złote emblematy cnót na czerni">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="#0c0e12"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <g fill="none" stroke="#d4af37" stroke-width="3">
    <!-- panel I : Sophia — oko mądrości -->
    <rect x="60" y="60" width="320" height="400" stroke-opacity="0.55"/>
    <ellipse cx="220" cy="250" rx="90" ry="48"/>
    <circle cx="220" cy="250" r="22"/>
    <circle cx="220" cy="250" r="6" fill="#d4af37" stroke="none"/>
    <line x1="220" y1="176" x2="220" y2="150"/>
    <line x1="220" y1="324" x2="220" y2="350"/>
    <text x="220" y="420" text-anchor="middle" fill="#d4af37" stroke="none" font-family="Georgia,serif" font-size="26" letter-spacing="6">I</text>
    <!-- panel II : Andreia — płomień odwagi -->
    <rect x="420" y="60" width="320" height="400" stroke-opacity="0.55"/>
    <path d="M580 180 C 540 240 520 270 520 310 a 60 70 0 0 0 120 0 C 640 270 620 240 580 180 Z"/>
    <path d="M580 260 c -14 18 -22 30 -22 46 a 22 26 0 0 0 44 0 c 0 -16 -8 -28 -22 -46 Z" fill="#d4af37" fill-opacity="0.35"/>
    <text x="580" y="420" text-anchor="middle" fill="#d4af37" stroke="none" font-family="Georgia,serif" font-size="26" letter-spacing="6">II</text>
    <!-- panel III : Dikaiosyne — waga sprawiedliwości -->
    <rect x="60" y="540" width="320" height="400" stroke-opacity="0.55"/>
    <line x1="220" y1="620" x2="220" y2="780"/>
    <line x1="150" y1="650" x2="290" y2="650"/>
    <line x1="150" y1="650" x2="130" y2="710"/>
    <line x1="150" y1="650" x2="170" y2="710"/>
    <path d="M130 710 a 20 14 0 0 0 40 0" />
    <line x1="290" y1="650" x2="270" y2="710"/>
    <line x1="290" y1="650" x2="310" y2="710"/>
    <path d="M270 710 a 20 14 0 0 0 40 0" />
    <line x1="190" y1="780" x2="250" y2="780"/>
    <text x="220" y="900" text-anchor="middle" fill="#d4af37" stroke="none" font-family="Georgia,serif" font-size="26" letter-spacing="6">III</text>
    <!-- panel IV : Sophrosyne — krąg umiaru -->
    <rect x="420" y="540" width="320" height="400" stroke-opacity="0.55"/>
    <circle cx="580" cy="700" r="80"/>
    <circle cx="580" cy="700" r="52" stroke-opacity="0.6"/>
    <circle cx="580" cy="700" r="10" fill="#d4af37" stroke="none"/>
    <line x1="580" y1="596" x2="580" y2="620"/>
    <line x1="580" y1="780" x2="580" y2="804"/>
    <text x="580" y="900" text-anchor="middle" fill="#d4af37" stroke="none" font-family="Georgia,serif" font-size="26" letter-spacing="6">IV</text>
  </g>
</svg>
